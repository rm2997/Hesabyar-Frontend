server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets
    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|ico|svg|webp|ttf|otf|eot|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # مخفی کردن فایل‌های سیستمی
    location ~ /\.(?!well-known) {
        deny all;
    }

    # خاموش کردن نمایش نسخه nginx
    server_tokens off;
}